sec": "四、单项选择", "type": "choice", "q": "______ done, Bobby!", "options": ["Well", "Good", "Very"], "answer": 0, "exp": "课文原句：Well done!（干得好！）是夸人的固定说法。"}, {"sec": "四、单项选择", "type": "choice", "q": "Helen cannot see ______ hear.", "options": ["or", "and", "but"], "answer": 0, "exp": "课文原句：She cannot see or hear.（她看不见也听不见。）cannot 后面的选择用 or。"}, {"sec": "四、单项选择", "type": "choice", "q": "Miss Sullivan writes some words ______ Helen's hand.", "options": ["on", "at", "of"], "answer": 0, "exp": "课文：She writes some words on Helen's hand.（在海伦手上写单词。）“在……上”用 on。"}, {"sec": "四、单项选择", "type": "choice", "q": "When ______ you feel bad?", "options": ["do", "does", "is"], "answer": 0, "exp": "主语是 you，问句用 do：When do you feel bad?"}, {"sec": "四、单项选择", "type": "choice", "q": "He ______ feel happy.", "options": ["doesn't", "don't", "isn't"], "answer": 0, "exp": "He 是第三人称单数，否定用 doesn't；doesn't 后面跟动词原形 feel。课本：does not feel happy。"}, {"sec": "五、用所给单词的适当形式填空", "type": "fill", "q": "Miss Sullivan ______ (teach) Helen.", "answers": ["teaches"], "exp": "teach 以 ch 结尾，第三人称单数加 es：teaches。"}, {"sec": "五、用所给单词的适当形式填空", "type": "fill", "q": "She ______ (try) hard and learns fast.", "answers": ["tries"], "exp": "try 的三单：把 y 变 i，再加 es：tries。"}, {"sec": "五、用所给单词的适当形式填空", "type": "fill", "q": "My sister ______ (study) English every day.", "answers": ["studies"], "exp": "study 的三单：把 y 变 i，再加 es：studies。"}, {"sec": "五、用所给单词的适当形式填空", "type": "fill", "q": "Bobby ______ (wash) his hands.", "answers": ["washes"], "exp": "wash 以 sh 结尾，第三人称单数加 es：washes。"}, {"sec": "五、用所给单词的适当形式填空", "type": "fill", "q": "He ______ (not feel) happy.", "answers": ["doesn't feel", "does not feel"], "exp": "He 是三单，否定是 does not / doesn't；后面跟动词原形 feel，不能加 s。"}, {"sec": "五、用所给单词的适当形式填空", "type": "fill", "q": "Helen ______ (not understand) the words.", "answers": ["doesn't understand", "does not understand"], "exp": "否定用 doesn't / does not，后面跟原形 understand。课文：She does not understand."}, {"sec": "五、用所给单词的适当形式填空", "type": "fill", "q": "Miss Sullivan does not ______ (give) up.", "answers": ["give"], "exp": "does not 后面跟动词原形：give up（放弃），give 不变形。"}, {"sec": "六、补全对话", "type": "choice", "q": "A: When do you feel bad?  B: ______", "options": ["When I don't do well at school.", "I talk with my friends.", "Well done!"], "answer": 0, "exp": "问“什么时候感觉不好”，课本句型答：When I don't do well at school."}, {"sec": "六、补全对话", "type": "choice", "q": "A: What do you do to feel good?  B: ______", "options": ["I talk with my teachers.", "When I feel bad.", "Don't be sad."], "answer": 0, "exp": "问“做什么让自己感觉好”，答做的事：I talk with my teachers.（我和老师聊天。）"}, {"sec": "六、补全对话", "type": "choice", "q": "A: Bobby, you are good at football!  B: ______", "options": ["Yeah! I am good at football!", "Ouch!", "I feel bad."], "answer": 0, "exp": "课文原句：Yeah! I am good at football!（对！我擅长足球！）"}, {"sec": "六、补全对话", "type": "choice", "q": "A: Why is Helen sad?  B: ______", "options": ["Because she cannot see or hear.", "She is excited.", "Well done!"], "answer": 0, "exp": "Why 问原因用 Because 回答：Because she cannot see or hear.（她看不见也听不见。）"}, {"sec": "六、补全对话", "type": "choice", "q": "A: Don't give up, Helen. Try hard!  B: ______", "options": ["I understand! I feel happy now.", "I cannot hear.", "Ouch!"], "answer": 0, "exp": "故事里 Helen 最后 understand（明白了），feels very happy，所以这样回答最合适。"}, {"sec": "七、连词成句", "type": "order", "q": "把下面的词连成一句话。", "words": ["Bobby", "is", "good", "at", "football", "."], "answer": "Bobby is good at football .", "exp": "be good at football：Bobby is good at football.（Bobby 擅长足球。）"}, {"sec": "七、连词成句", "type": "order", "q": "把下面的词连成一句话。", "words": ["She", "does", "not", "give", "up", "."], "answer": "She does not give up .", "exp": "课文：She does not give up.（她不放弃。）does not 后面跟原形 give。"}, {"sec": "七、连词成句", "type": "order", "q": "把下面的词连成一句话。", "words": ["When", "do", "you", "feel", "bad", "?"], "answer": "When do you feel bad ?", "exp": "问句语序：When + do you feel bad? 主语 you 用 do 提问。"}, {"sec": "七、连词成句", "type": "order", "q": "把下面的词连成一句话。", "words": ["Miss", "Sullivan", "teaches", "Helen", "."], "answer": "Miss Sullivan teaches Helen .", "exp": "主语 Miss Sullivan 是第三人称单数，teach 变 teaches：Miss Sullivan teaches Helen."}, {"sec": "八、阅读理解", "type": "choice", "q": "What is Amy not good at?", "options": ["She is not good at singing.", "She is not good at drawing.", "She is not good at football."], "answer": 0, "passage": "A", "exp": "短文：she is not good at singing.（她不擅长唱歌。）"}, {"sec": "八、阅读理解", "type": "choice", "q": "How does Amy feel at first?", "options": ["She feels sad.", "She feels excited.", "She feels worried."], "answer": 0, "passage": "A", "exp": "短文：She feels sad.（她很难过。）at first 是“一开始”。"}, {"sec": "八、阅读理解", "type": "choice", "q": "What does Kate say to Amy?", "options": ["Don't be sad. You're good at other things.", "Well done! You draw very well.", "Give up, Amy."], "answer": 0, "passage": "A", "exp": "短文里 Kate 说：Don't be sad. You're good at other things.（别难过，你擅长别的事情。）"}, {"sec": "八、阅读理解", "type": "choice", "q": "What does Amy draw?", "options": ["A bird and a flower.", "Some words.", "Water."], "answer": 0, "passage": "A", "exp": "短文：She draws a bird and a flower.（她画了一只鸟和一朵花。）注意 draws 是三单。"}, {"sec": "八、阅读理解", "type": "choice", "q": "Is Amy good at drawing?", "options": ["Yes, she is.", "No, she isn't.", "She feels sad."], "answer": 0, "passage": "A", "exp": "短文最后：She is good at drawing. 所以答案是 Yes, she is."}, {"sec": "八、阅读理解", "type": "choice", "q": "What is Jack good at?", "options": ["He is good at football.", "He is good at the high jump.", "He is good at singing."], "answer": 0, "passage": "B", "exp": "短文：Jack is good at football.（杰克擅长足球。）"}, {"sec": "八、阅读理解", "type": "choice", "q": "What is Jack not good at?", "options": ["He is not good at the high jump.", "He is not good at football.", "He is not good at running."], "answer": 0, "passage": "B", "exp": "短文：He is not good at the high jump.（他不擅长跳高。）"}, {"sec": "八、阅读理解", "type": "choice", "q": "How does Jack feel when he cannot jump high?", "options": ["He feels bad.", "He feels excited.", "He feels happy."], "answer": 0, "passage": "B", "exp": "短文：he cannot jump high. He feels bad.（跳不高时他感觉很不好。）"}, {"sec": "八、阅读理解", "type": "choice", "q": "What does Jack's friend say?", "options": ["You run fast and you're good at football!", "Give up!", "Ouch!"], "answer": 0, "passage": "B", "exp": "短文里朋友说：You run fast and you're good at football!（你跑得快，还擅长足球！）"}, {"sec": "八、阅读理解", "type": "choice", "q": "How does Jack feel at last?", "options": ["He feels good.", "He feels bad.", "He feels worried."], "answer": 0, "passage": "B", "exp": "短文最后：Jack feels good now.（他现在感觉好多了。）"}];

var qi = 0, ans = new Array(QUIZ.length).fill(null), submitted = false;
var SKEY = 'paperdraft_v1_' + document.title + '_' + QUIZ.length;
function saveState(){
  try{
    if(submitted){ localStorage.removeItem(SKEY); return; }
    localStorage.setItem(SKEY, JSON.stringify({ans:ans, qi:qi, sec:Math.floor((Date.now()-t0)/1000)}));
  }catch(e){}
}
function loadState(){
  try{
    var s = localStorage.getItem(SKEY);
    if(!s) return;
    var d = JSON.parse(s);
    if(d && d.ans && d.ans.length===QUIZ.length){
      ans = d.ans;
      if(typeof d.qi==='number' && d.qi>=0 && d.qi<QUIZ.length) qi = d.qi;
      if(d.sec) t0 = Date.now() - d.sec*1000;
    }
  }catch(e){}
}
setInterval(saveState, 1500);
window.addEventListener('beforeunload', saveState);
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') saveState(); });
var au = document.getElementById('au');
var t0 = Date.now(), timerOn = true;
setInterval(function(){
  if(!timerOn) return;
  var s = Math.floor((Date.now()-t0)/1000);
  var m = Math.floor(s/60); s = s%60;

}, 1000);
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}

function playQAudio(i){ au.src=QUIZ[i].audio; au.play(); }

    h += '<button class="key wide" data-k=" " onclick="ktype(this.dataset.k)">空格</button>';
    h += '<button class="key wide" onclick="kback()">⌫ 删除</button>';
    h += '<button class="key wide" onclick="kclear()">清空</button>';
    h += '</div>';
    h += '<div class="hint">💡 用下面的字母键盘拼出单词的正确形式；大小写无关</div>';
  }
  document.getElementById('card').innerHTML = h;
  document.getElementById('pgnum').textContent = (qi+1)+' / '+QUIZ.length;
  document.getElementById('prev').disabled = (qi===0);
  document.getElementById('next').disabled = (qi===QUIZ.length-1);
  drawPal(); au.pause();
}
function pick(idx){ if(submitted) return; ans[qi]=idx; render(); }
function wpick(wi){ if(submitted) return; var cur=ans[qi]||[]; if(cur.indexOf(wi)<0){cur.push(wi);} ans[qi]=cur; render(); }
function unpick(k){ if(submitted) return; var cur=ans[qi]||[]; cur.splice(k,1); ans[qi]=cur; render(); }
function fillIn(v){ if(submitted) return; ans[qi]=v; drawPal(); }
function fillShow(){
  var v = (ans[qi]===null||ans[qi]===undefined)?'':String(ans[qi]);
  var d = document.getElementById('filldisp');
  if(d){ d.innerHTML = v ? esc(v) : '<span style="color:#b7a78f">点下面的字母拼出单词</span>'; }
  drawPal();
}
function ktype(ch){ if(submitted) return; var v=(ans[qi]===null||ans[qi]===undefined)?'':String(ans[qi]); if(v.length<24){ ans[qi]=v+ch; } fillShow(); }
function kback(){ if(submitted) return; var v=(ans[qi]===null||ans[qi]===undefined)?'':String(ans[qi]); ans[qi]=v.slice(0,-1); fillShow(); }
function kclear(){ if(submitted) return; ans[qi]=''; fillShow(); }
function goQ(d){ var nq=qi+d; if(nq<0||nq>=QUIZ.length) return; qi=nq; render(); }
function jump(i){ qi=i; render(); window.scrollTo(0,0); }
function drawPal(){
  var h='';
  for(var i=0;i<QUIZ.length;i++){
    h += '<button class="pn'+(isDone(i)?' done':'')+(i===qi?' cur':'')+'" onclick="jump('+i+')">'+(i+1)+'</button>';
  }
  document.getElementById('pgrid').innerHTML = h;
}
function norm(s){ return s.toLowerCase().replace(/\s+/g,' ').trim(); }
function qCorrect(i){
  var q=QUIZ[i], a=ans[i];
  if(a===null||a===undefined) return false;
  if(q.type==='choice') return a===q.answer;
  if(q.type==='fill'){
    var vv = norm(String(a));
    if(!vv) return false;
    return q.answers.some(function(x){ return norm(x)===vv; });
  }
  if(!a.length) return false;
  return norm(a.map(function(wi){return q.words[wi];}).join(' '))===norm(q.answer);
}
function confirmSubmit(){
  var left=0; for(var i=0;i<QUIZ.length;i++) if(!isDone(i)) left++;
  var msg = left>0 ? '还有 '+left+' 道题没做，确定要交卷吗？' : '确定要交卷吗？';
  var bar = document.getElementById('cfbar');
  if(!bar){
    bar = document.createElement('div');
    bar.id = 'cfbar';
    bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#fff8ec;border-top:3px solid #e8a33d;padding:16px;text-align:center;box-shadow:0 -3px 12px rgba(0,0,0,.18)';
    var t = document.createElement('div');
    t.id = 'cfmsg';
    t.style.cssText = 'font-size:1.05rem;margin-bottom:12px;color:#5a4632';
    bar.appendChild(t);
    var b1 = document.createElement('button');
    b1.textContent = '再检查一下';
    b1.style.cssText = 'font-size:1rem;padding:10px 20px;margin-right:14px;border-radius:10px;border:1.5px solid #c9b18c;background:#fff;color:#5a4632';
    b1.onclick = function(){ bar.style.display = 'none'; };
    bar.appendChild(b1);
    var b2 = document.createElement('button');
    b2.textContent = '确定交卷 ✓';
    b2.style.cssText = 'font-size:1rem;padding:10px 20px;border-radius:10px;border:none;background:#e8a33d;color:#fff;font-weight:bold';
    b2.onclick = function(){ bar.style.display = 'none'; doSubmit(); };
    bar.appendChild(b2);
    document.body.appendChild(bar);
  }
  document.getElementById('cfmsg').textContent = msg;
  bar.style.display = 'block';
}
function doSubmit(){
  submitted=true; timerOn=false; saveState();
  var score=0; for(var i=0;i<QUIZ.length;i++) if(qCorrect(i)) score++;
  var n=QUIZ.length, pct=Math.round(score/n*100), stars='';
  for(var s=0;s<5;s++) stars += (s < Math.round(pct/20) ? '⭐' : '☆');
  var msg = pct===100?'满分！太了不起了！':(pct>=85?'优秀！继续保持！':(pct>=60?'及格了，再复习一下错题吧！':'没关系，看看错题解析再来一次吧！'));
  var h='<div class="sec">🎯 交卷成功！</div>';
  h+='<div class="stars">'+stars+'</div>';
  h+='<div class="bigscore">'+score+' / '+n+'（'+pct+'分）</div>';
  h+='<div class="q" style="text-align:center;font-size:1rem;color:#8a7a68">'+msg+'</div>';
  h+='<div class="review">';
  QUIZ.forEach(function(q,i){
    var ok=qCorrect(i), mine;
    if(q.type==='choice'){ mine = (ans[i]===null||ans[i]===undefined)?'（未作答）':q.options[ans[i]]; }
    else if(q.type==='fill'){ mine = (ans[i]&&String(ans[i]).trim())?ans[i]:'（未作答）'; }
    else { mine = (ans[i]&&ans[i].length)?ans[i].map(function(wi){return q.words[wi];}).join(' '):'（未作答）'; }
    var right = q.type==='choice'?q.options[q.answer]:(q.type==='fill'?q.answers.join(' / '):q.answer);
    h+='<div class="'+(ok?'rok':'rbad')+'">'+(ok?'✅':'❌')+' 第'+(i+1)+'题：'+esc(q.q).substring(0,26)+'…<br>　你的答案：'+esc(mine)+'<br>　正确答案：'+esc(right)+(ok?'':'<br>　💡 '+esc(q.exp||''))+'</div>';
  });
  h+='</div><div style="text-align:center;margin-top:12px"><button class="qbtn" onclick="location.reload()">🔄 再测一次</button></div>';
  document.getElementById('card').innerHTML=h;
  document.getElementById('nav').style.display='none';
  document.getElementById('palette').style.display='none';
  document.getElementById('timer').textContent+=' ⏹';
  window.scrollTo(0,0);
}
loadState();
render();
</script>
</body>
