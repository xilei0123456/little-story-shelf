var qi = 0, ans = new Array(QUIZ.length).fill(null), submitted = false;
var SKEY = 'paperdraft_v1_' + document.title + '_' + QUIZ.length;
function saveState(){
  try{
    if(submitted){ localStorage.removeItem(SKEY); return; }
    localStorage.setItem(SKEY, JSON.stringify({ans:ans, qi:qi, sec:Math.floor((Date.now()-t0)/1000)}));
  }catch(e){}
}
function loadState(){
  try{
    var s = localStorage.getItem(SKEY);
    if(!s) return;
    var d = JSON.parse(s);
    if(d && d.ans && d.ans.length===QUIZ.length){
      ans = d.ans;
      if(typeof d.qi==='number' && d.qi>=0 && d.qi<QUIZ.length) qi = d.qi;
      if(d.sec) t0 = Date.now() - d.sec*1000;
    }
  }catch(e){}
}
setInterval(saveState, 1500);
window.addEventListener('beforeunload', saveState);
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') saveState(); });
var au = document.getElementById('au');
var t0 = Date.now(), timerOn = true;
setInterval(function(){
  if(!timerOn) return;
  var s = Math.floor((Date.now()-t0)/1000);
  var m = Math.floor(s/60); s = s%60;
  document.getElementById('timer').textContent = '⏱ '+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}, 1000);
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function playPassage(key){ au.src=PASSAGES[key].audio; au.play(); }
function playQAudio(i){ au.src=QUIZ[i].audio; au.play(); }
function isDone(i){ var a=ans[i]; if(a===null||a===undefined) return false; if(QUIZ[i].type==='order') return a.length>0; if(QUIZ[i].type==='fill') return String(a).trim().length>0; return true; }
function render(){
  var q = QUIZ[qi], h = '';
  h += '<div class="sec">'+esc(q.sec)+' · 第 '+(qi+1)+' / '+QUIZ.length+' 题</div>';
  if(q.passage){
    var p = PASSAGES[q.passage];
    h += '<div class="passage"><b>'+esc(p.title)+'</b><br>'+esc(p.text)+'<br><button class="playbtn" onclick="playPassage(\''+q.passage+'\')">🔊 听短文</button></div>';
  }
  if(q.audio){
    h += '<div><button class="playbtn" onclick="playQAudio('+qi+')">🔊 播放听力</button></div>';
  }
  h += '<div class="q">'+esc(q.q)+'</div>';
  if(q.type==='choice'){
    q.options.forEach(function(o,idx){
      var cls = (ans[qi]===idx) ? 'opt sel' : 'opt';
      h += '<button class="'+cls+'" onclick="pick('+idx+')">'+esc(o)+'</button>';
    });
  } else if(q.type==='order'){
    var cur = ans[qi] || [];
    h += '<div id="built">';
    cur.forEach(function(wi,k){ h += '<span class="bchip" onclick="unpick('+k+')">'+esc(q.words[wi])+' ✕</span>'; });
    if(!cur.length) h += '<span style="color:#b7a78f">点下面的单词组句子，点已选的词可撤回</span>';
    h += '</div><div class="hint">💡 点已选的单词可退回重选，点下面的单词继续组句</div><div class="wpool">';
    q.words.forEach(function(w,idx){
      h += '<button class="wchip'+(cur.indexOf(idx)>=0?' used':'')+'" onclick="wpick('+idx+')">'+esc(w)+'</button>';
    });
    h += '</div><div><button class="qbtn ghost" onclick="ans['+qi+']=[];render();drawPal()">清空重组</button></div>';
  } else if(q.type==='fill'){
    var v = (ans[qi]===null||ans[qi]===undefined)?'':ans[qi];
    h += '<div id="filldisp" class="filldisp">'+(v?esc(v):'<span style="color:#b7a78f">点下面的字母拼出单词</span>')+'</div>';
    h += '<div class="kbd">';
    var rows = ["qwertyuiop","asdfghjkl","zxcvbnm"];
    rows.forEach(function(r){
      for(var ci=0;ci<r.length;ci++){
        var ch = r.charAt(ci);
        h += '<button class="key" data-k="'+ch+'" onclick="ktype(this.dataset.k)">'+ch+'</button>';
      }
    });
    h += '<button class="key" data-k="&#39;" onclick="ktype(this.dataset.k)">’</button>';
    h += '<button class="key wide" data-k=" " onclick="ktype(this.dataset.k)">空格</button>';
    h += '<button class="key wide" onclick="kback()">⌫ 删除</button>';
    h += '<button class="key wide" onclick="kclear()">清空</button>';
    h += '</div>';
    h += '<div class="hint">💡 用下面的字母键盘拼出单词的正确形式；大小写无关</div>';
  }
  document.getElementById('card').innerHTML = h;
  document.getElementById('pgnum').textContent = (qi+1)+' / '+QUIZ.length;
  document.getElementById('prev').disabled = (qi===0);
  document.getElementById('next').disabled = (qi===QUIZ.length-1);
  drawPal(); au.pause();
}
function pick(idx){ if(submitted) return; ans[qi]=idx; render(); }
function wpick(wi){ if(submitted) return; var cur=ans[qi]||[]; if(cur.indexOf(wi)<0){cur.push(wi);} ans[qi]=cur; render(); }
function unpick(k){ if(submitted) return; var cur=ans[qi]||[]; cur.splice(k,1); ans[qi]=cur; render(); }
function fillIn(v){ if(submitted) return; ans[qi]=v; drawPal(); }
function fillShow(){
  var v = (ans[qi]===null||ans[qi]===undefined)?'':String(ans[qi]);
  var d = document.getElementById('filldisp');
  if(d){ d.innerHTML = v ? esc(v) : '<span style="color:#b7a78f">点下面的字母拼出单词</span>'; }
  drawPal();
}
function ktype(ch){ if(submitted) return; var v=(ans[qi]===null||ans[qi]===undefined)?'':String(ans[qi]); if(v.length<24){ ans[qi]=v+ch; } fillShow(); }
function kback(){ if(submitted) return; var v=(ans[qi]===null||ans[qi]===undefined)?'':String(ans[qi]); ans[qi]=v.slice(0,-1); fillShow(); }
function kclear(){ if(submitted) return; ans[qi]=''; fillShow(); }
function goQ(d){ var nq=qi+d; if(nq<0||nq>=QUIZ.length) return; qi=nq; render(); }
function jump(i){ qi=i; render(); window.scrollTo(0,0); }
function drawPal(){
  var h='';
  for(var i=0;i<QUIZ.length;i++){
    h += '<button class="pn'+(isDone(i)?' done':'')+(i===qi?' cur':'')+'" onclick="jump('+i+')">'+(i+1)+'</button>';
  }
  document.getElementById('pgrid').innerHTML = h;
}
function norm(s){ return s.toLowerCase().replace(/\s+/g,' ').trim(); }
function qCorrect(i){
  var q=QUIZ[i], a=ans[i];
  if(a===null||a===undefined) return false;
  if(q.type==='choice') return a===q.answer;
  if(q.type==='fill'){
    var vv = norm(String(a));
    if(!vv) return false;
    return q.answers.some(function(x){ return norm(x)===vv; });
  }
  if(!a.length) return false;
  return norm(a.map(function(wi){return q.words[wi];}).join(' '))===norm(q.answer);
}
function confirmSubmit(){
  var left=0; for(var i=0;i<QUIZ.length;i++) if(!isDone(i)) left++;
  var msg = left>0 ? '还有 '+left+' 道题没做，确定要交卷吗？' : '确定要交卷吗？';
  var bar = document.getElementById('cfbar');
  if(!bar){
    bar = document.createElement('div');
    bar.id = 'cfbar';
    bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#fff8ec;border-top:3px solid #e8a33d;padding:16px;text-align:center;box-shadow:0 -3px 12px rgba(0,0,0,.18)';
    var t = document.createElement('div');
    t.id = 'cfmsg';
    t.style.cssText = 'font-size:1.05rem;margin-bottom:12px;color:#5a4632';
    bar.appendChild(t);
    var b1 = document.createElement('button');
    b1.textContent = '再检查一下';
    b1.style.cssText = 'font-size:1rem;padding:10px 20px;margin-right:14px;border-radius:10px;border:1.5px solid #c9b18c;background:#fff;color:#5a4632';
    b1.onclick = function(){ bar.style.display = 'none'; };
    bar.appendChild(b1);
    var b2 = document.createElement('button');
    b2.textContent = '确定交卷 ✓';
    b2.style.cssText = 'font-size:1rem;padding:10px 20px;border-radius:10px;border:none;background:#e8a33d;color:#fff;font-weight:bold';
    b2.onclick = function(){ bar.style.display = 'none'; doSubmit(); };
    bar.appendChild(b2);
    document.body.appendChild(bar);
  }
  document.getElementById('cfmsg').textContent = msg;
  bar.style.display = 'block';
}
function doSubmit(){
  submitted=true; timerOn=false; saveState();
  var score=0; for(var i=0;i<QUIZ.length;i++) if(qCorrect(i)) score++;
  var n=QUIZ.length, pct=Math.round(score/n*100), stars='';
  for(var s=0;s<5;s++) stars += (s < Math.round(pct/20) ? '⭐' : '☆');
  var msg = pct===100?'满分！太了不起了！':(pct>=85?'优秀！继续保持！':(pct>=60?'及格了，再复习一下错题吧！':'没关系，看看错题解析再来一次吧！'));
  var h='<div class="sec">🎯 交卷成功！</div>';
  h+='<div class="stars">'+stars+'</div>';
  h+='<div class="bigscore">'+score+' / '+n+'（'+pct+'分）</div>';
  h+='<div class="q" style="text-align:center;font-size:1rem;color:#8a7a68">'+msg+'</div>';
  h+='<div class="review">';
  QUIZ.forEach(function(q,i){
    var ok=qCorrect(i), mine;
    if(q.type==='choice'){ mine = (ans[i]===null||ans[i]===undefined)?'（未作答）':q.options[ans[i]]; }
    else if(q.type==='fill'){ mine = (ans[i]&&String(ans[i]).trim())?ans[i]:'（未作答）'; }
    else { mine = (ans[i]&&ans[i].length)?ans[i].map(function(wi){return q.words[wi];}).join(' '):'（未作答）'; }
    var right = q.type==='choice'?q.options[q.answer]:(q.type==='fill'?q.answers.join(' / '):q.answer);
    h+='<div class="'+(ok?'rok':'rbad')+'">'+(ok?'✅':'❌')+' 第'+(i+1)+'题：'+esc(q.q).substring(0,26)+'…<br>　你的答案：'+esc(mine)+'<br>　正确答案：'+esc(right)+(ok?'':'<br>　💡 '+esc(q.exp||''))+'</div>';
  });
  h+='</div><div style="text-align:center;margin-top:12px"><button class="qbtn" onclick="location.reload()">🔄 再测一次</button></div>';
  document.getElementById('card').innerHTML=h;
  document.getElementById('nav').style.display='none';
  document.getElementById('palette').style.display='none';
  document.getElementById('timer').textContent+=' ⏹';
  window.scrollTo(0,0);
}
loadState();
render();
</script>

        wrong.push({no: i+1, type: q.type, stem: q.q, options: q.options || null, words: q.words || null, mine: String(mine), right: String(right), exp: q.exp || ''});
