<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Georgia,'Times New Roman',serif;background:linear-gradient(135deg,#fff7e6,#e6f7ff);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px;color:#4a3728}
h1{font-size:1.3rem;margin:8px 0 4px;color:#c2703d;text-align:center}
.sub{color:#8a7a68;margin-bottom:10px;font-size:.9rem;text-align:center}
#timer{font-size:.95rem;color:#c2703d;font-weight:bold;margin-bottom:8px}
#card{background:#fff;border-radius:24px;box-shadow:0 8px 30px rgba(0,0,0,.12);max-width:640px;width:100%;padding:26px;min-height:440px;display:flex;flex-direction:column}
#card .sec{font-size:.95rem;color:#c2703d;font-weight:bold;margin-bottom:10px}
#card .q{font-size:1.2rem;line-height:1.7;margin-bottom:14px}
.passage{background:#fffdf4;border:1px dashed #e0b96a;border-radius:12px;padding:12px;font-size:.98rem;line-height:1.8;margin-bottom:12px;color:#6b5a44}
.opt{display:block;width:100%;margin:8px 0;padding:12px;border:2px solid #ffd9a0;border-radius:14px;background:#fffdf8;font-size:1.05rem;cursor:pointer;color:#4a3728;text-align:left}
.opt.sel{background:#dbeeff;border-color:#4a90d9}
.wpool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.wchip{background:#fffdf8;border:2px solid #ffd9a0;border-radius:999px;padding:8px 14px;font-size:1rem;cursor:pointer;color:#4a3728}
.wchip.used{opacity:.25;pointer-events:none}
#built{min-height:52px;border:2px dashed #e0b96a;border-radius:12px;padding:10px;font-size:1.1rem;margin-bottom:10px;color:#4a3728}
.bchip{display:inline-block;background:#dbeeff;border-radius:999px;padding:6px 12px;margin:3px;font-size:1rem;cursor:pointer}
.filldisp{min-height:56px;border:2px solid #ffd9a0;border-radius:14px;padding:12px;font-size:1.35rem;margin-bottom:12px;background:#fffdf8;color:#4a3728;letter-spacing:2px;font-family:inherit}
.kbd{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:8px}
.key{min-width:38px;max-width:50px;flex:1 0 auto;padding:10px 0;background:#fff;border:2px solid #ffd9a0;border-radius:10px;font-size:1.15rem;color:#4a3728;cursor:pointer;font-family:inherit}
.key:active{background:#dbeeff;border-color:#4a90d9}
.key.wide{max-width:120px;flex:2 0 auto;font-size:1rem}
.qbtn{font-size:1rem;background:#ffb84d;border:none;border-radius:999px;padding:11px 26px;cursor:pointer;color:#5a3a1a;font-weight:bold;box-shadow:0 4px 12px rgba(255,184,77,.5)}
.qbtn.ghost{background:#fff;border:2px solid #ffb84d;color:#c2703d;box-shadow:none}
.qbtn.danger{background:#e06666;color:#fff;box-shadow:0 4px 12px rgba(224,102,102,.4)}
.playbtn{font-size:.95rem;background:#ffb84d;border:none;border-radius:999px;padding:8px 20px;cursor:pointer;color:#5a3a1a;font-weight:bold;margin-bottom:10px}
#nav{display:flex;gap:12px;align-items:center;margin-top:14px;flex-wrap:wrap;justify-content:center}
#nav button{font-size:.95rem;background:#fff;border:2px solid #ffb84d;border-radius:999px;padding:10px 20px;cursor:pointer;color:#c2703d;font-weight:bold}
#nav button:disabled{opacity:.35;cursor:default}
#pgnum{font-size:.95rem;color:#8a7a68;min-width:80px;text-align:center}
#palette{max-width:640px;width:100%;background:#fff;border-radius:18px;box-shadow:0 4px 16px rgba(0,0,0,.08);padding:14px;margin-top:14px}
#palette .pt{font-size:.9rem;color:#8a7a68;margin-bottom:8px}
#pgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.pn{aspect-ratio:1;border:2px solid #ffd9a0;background:#fffdf8;border-radius:10px;font-size:.9rem;color:#8a7a68;cursor:pointer}
.pn.done{background:#dbeeff;border-color:#4a90d9;color:#2a5a9a;font-weight:bold}
.pn.cur{border-color:#c2703d;box-shadow:0 0 0 2px #ffd9a0}
.stars{font-size:2.4rem;margin:10px 0;letter-spacing:6px;text-align:center}
.bigscore{font-size:2rem;color:#c2703d;font-weight:bold;text-align:center;margin:6px 0}
.review{text-align:left;font-size:.92rem;line-height:1.9;margin-top:8px}
.review .rok{color:#2e7d32}
.review .rbad{color:#c62828}
.hint{font-size:.85rem;color:#8a7a68;margin-top:8px;text-align:center}

"sec": "四、单项选择", "type": "choice", "q": "Wang Bing ______ notes in class.", "options": ["takes", "take", "taking"], "answer": 0, "exp": "Wang Bing 是第三人称单数，take 加 s：takes notes（记笔记）。"}, {"sec": "四、单项选择", "type": "choice", "q": "He ______ his school things in order every evening.", "options": ["puts", "put", "putting"], "answer": 0, "exp": "He 是第三人称单数，put 加 s：puts his school things in order（把他的学习用品整理好）。"}, {"sec": "四、单项选择", "type": "choice", "q": "She ______ chores at home every day.", "options": ["does", "do", "doing"], "answer": 0, "exp": "She 是第三人称单数，do 要变 does：does chores（做家务）。"}, {"sec": "四、单项选择", "type": "choice", "q": "______ a minute! I want to tidy my room first.", "options": ["Wait", "Listen", "Put"], "answer": 0, "exp": "课文原句：Wait a minute!（等一分钟！）Bobby 就是这样说的。"}, {"sec": "四、单项选择", "type": "choice", "q": "Bobby ______ keeps his room tidy.", "options": ["never", "listens", "healthy"], "answer": 0, "exp": "课文原句：Bobby never keeps his room tidy.（Bobby 从不保持房间整齐。）never 是“从不”。"}, {"sec": "四、单项选择", "type": "choice", "q": "Reading in bed is bad for your ______.", "options": ["eyes", "card", "habit"], "answer": 0, "exp": "课文：It is bad for her eyes.（在床上读书对眼睛不好。）"}, {"sec": "四、单项选择", "type": "choice", "q": "Wang Bing is strong and healthy, but he often goes to bed ______.", "options": ["late", "tidy", "carefully"], "answer": 0, "exp": "go to bed late 是“晚睡”。课文：he often goes to bed late. 这是他的坏习惯。"}, {"sec": "四、单项选择", "type": "choice", "q": "He does exercise every day. He is strong and ______.", "options": ["healthy", "late", "bad"], "answer": 0, "exp": "课文原句：strong and healthy（强壮又健康）。"}, {"sec": "四、单项选择", "type": "choice", "q": "She likes reading very much. She reads ______ books.", "options": ["a lot of", "never", "in order"], "answer": 0, "exp": "课文原句：She reads a lot of books.（她读很多书。）a lot of 是“很多”。"}, {"sec": "四、单项选择", "type": "choice", "q": "What good habits ______ you have?", "options": ["do", "does", "is"], "answer": 0, "exp": "主语是 you，问句要用 do：What good habits do you have? 只有主语是 he/she 时才用 does。"}, {"sec": "四、单项选择", "type": "choice", "q": "— ______ is it a bad habit? — Because it is bad for his health.", "options": ["Why", "What", "Who"], "answer": 0, "exp": "回答用 Because 说的是原因，所以问句要用 Why（为什么）。"}, {"sec": "五、用所给单词的适当形式填空", "type": "fill", "q": "He ______ (keep) his room tidy.", "answers": ["keeps"], "exp": "He 是第三人称单数，keep 加 s：keeps。"}, {"sec": "五、用所给单词的适当形式填空", "type": "fill", "q": "She ______ (listen) to her teachers carefully in class.", "answers": ["listens"], "exp": "She 是第三人称单数，listen 加 s：listens。"}, {"sec": "五、用所给单词的适当形式填空", "type": "fill", "q": "Wang Bing ______ (put) his school things in order every evening.", "answers": ["puts"], "exp": "Wang Bing 是第三人称单数，put 加 s：puts。"}, {"sec": "五、用所给单词的适当形式填空", "type": "fill", "q": "He often ______ (go) to bed late.", "answers": ["goes"], "exp": "go 以字母 o 结尾，第三人称单数加 es：goes。"}, {"sec": "五、用所给单词的适当形式填空", "type": "fill", "q": "She ______ (do) chores at home every day.", "answers": ["does"], "exp": "do 的第三人称单数是 does，要整体变，不能只加 s。"}, {"sec": "五、用所给单词的适当形式填空", "type": "fill", "q": "My father ______ (have) many good habits.", "answers": ["has"], "exp": "have 的第三人称单数是 has，是特殊变化，要记住。"}, {"sec": "五、用所给单词的适当形式填空", "type": "fill", "q": "Yang Ling ______ (read) a lot of books.", "answers": ["reads"], "exp": "Yang Ling 是第三人称单数，read 加 s：reads。课文：She reads a lot of books."}, {"sec": "六、补全对话", "type": "choice", "q": "A: What good habits do you have?  B: ______", "options": ["I listen to my teachers carefully.", "Yes, I do.", "Because it is bad."], "answer": 0, "exp": "问“你有什么好习惯”，要用好习惯的内容回答：I listen to my teachers carefully."}, {"sec": "六、补全对话", "type": "choice", "q": "A: Do you have any bad habits?  B: ______", "options": ["Yes. I often read in bed.", "I do exercise every day.", "Wait a minute!"], "answer": 0, "exp": "Do 开头的问句先答 Yes，再说出坏习惯：I often read in bed."}, {"sec": "六、补全对话", "type": "choice", "q": "A: ______  B: Because it is bad for my eyes.", "options": ["Why is it a bad habit?", "What good habits do you have?", "Do you read in bed?"], "answer": 0, "exp": "B 用 Because 回答原因，所以 A 要问 Why is it a bad habit?（为什么这是个坏习惯？）"}, {"sec": "六、补全对话", "type": "choice", "q": "A: Tina, your room is clean and tidy!  B: Thank you. Bobby, it's your ______ now.", "options": ["turn", "habit", "card"], "answer": 0, "exp": "It's your turn.（轮到你了。）是课本里的句型。"}, {"sec": "六、补全对话", "type": "choice", "q": "A: Be careful, Aunt Alice. Bobby ______ keeps his room tidy.  B: OK.", "options": ["never", "very much", "a lot of"], "answer": 0, "exp": "课文原句：Bobby never keeps his room tidy. never（从不）放在 keeps 前面。"}, {"sec": "七、连词成句", "type": "order", "q": "把下面的词连成一句话。", "words": ["He", "listens", "to", "his", "teachers", "carefully", "."], "answer": "He listens to his teachers carefully .", "exp": "语序：主语 He + listens to his teachers + carefully。主语是 He，listen 用三单 listens。"}, {"sec": "七、连词成句", "type": "order", "q": "把下面的词连成一句话。", "words": ["She", "does", "well", "at", "school", "."], "answer": "She does well at school .", "exp": "课文：She does well at school.（她在学校表现好。）"}, {"sec": "七、连词成句", "type": "order", "q": "把下面的词连成一句话。", "words": ["What", "good", "habits", "do", "you", "have", "?"], "answer": "What good habits do you have ?", "exp": "问句语序：What + good habits + do you have? 主语 you 用 do 提问。"}, {"sec": "七、连词成句", "type": "order", "q": "把下面的词连成一句话。", "words": ["Bobby", "never", "keeps", "his", "room", "tidy", "."], "answer": "Bobby never keeps his room tidy .", "exp": "never 放在动词 keeps 前面；Bobby 是第三人称单数，keep 变 keeps。"}, {"sec": "八、阅读理解", "type": "choice", "q": "What does Peter do every day?", "options": ["He does exercise.", "He reads in bed.", "He goes to bed late."], "answer": 0, "passage": "A", "exp": "短文：He does exercise every day.（他每天锻炼。）"}, {"sec": "八、阅读理解", "type": "choice", "q": "In class, Peter ______.", "options": ["listens to his teachers carefully", "reads in bed", "goes to bed late"], "answer": 0, "passage": "A", "exp": "短文：he listens to his teachers carefully and takes notes.（认真听老师讲课，还记笔记。）"}, {"sec": "八、阅读理解", "type": "choice", "q": "What does Peter do in the evening?", "options": ["He puts his school things in order.", "He does chores at home.", "He goes to bed late."], "answer": 0, "passage": "A", "exp": "短文：In the evening, he puts his school things in order.（晚上整理学习用品。）"}, {"sec": "八、阅读理解", "type": "choice", "q": "What is Peter's bad habit?", "options": ["He often reads in bed.", "He often goes to bed late.", "He never does exercise."], "answer": 0, "passage": "A", "exp": "短文：He often reads in bed.（经常在床上读书。）这是 Peter 的坏习惯。"}, {"sec": "八、阅读理解", "type": "choice", "q": "Reading in bed is bad for Peter's ______.", "options": ["eyes", "health", "school things"], "answer": 0, "passage": "A", "exp": "短文：It is bad for his eyes.（对他的眼睛不好。）"}, {"sec": "八、阅读理解", "type": "choice", "q": "Who is Lucy?", "options": ["Yang Ling's friend.", "Wang Bing's friend.", "Bobby's teacher."], "answer": 0, "passage": "B", "exp": "短文第一句：Lucy is Yang Ling's friend."}, {"sec": "八、阅读理解", "type": "choice", "q": "What does Lucy like very much?", "options": ["She likes reading very much.", "She likes sport very much.", "She likes chores very much."], "answer": 0, "passage": "B", "exp": "短文：She likes reading very much.（她非常喜欢读书。）"}, {"sec": "八、阅读理解", "type": "choice", "q": "What does Lucy do at home every day?", "options": ["She does chores.", "She does exercise.", "She takes notes."], "answer": 0, "passage": "B", "exp": "短文：At home, she does chores every day.（在家每天做家务。）"}, {"sec": "八、阅读理解", "type": "choice", "q": "How is Lucy's room?", "options": ["It is clean and tidy.", "It is never clean.", "It is bad for her health."], "answer": 0, "passage": "B", "exp": "短文：She keeps her room clean and tidy.（她的房间干净整齐。）"}, {"sec": "八、阅读理解", "type": "choice", "q": "What is Lucy's bad habit?", "options": ["She often goes to bed late.", "She often reads in bed.", "She never does chores."], "answer": 0, "passage": "B", "exp": "短文：Lucy often goes to bed late.（经常晚睡。）It is bad for her health."}];

var qi = 0, ans = new Array(QUIZ.length).fill(null), submitted = false;
var au = document.getElementById('au');
var t0 = Date.now(), timerOn = true;
setInterval(function(){
  if(!timerOn) return;
  var s = Math.floor((Date.now()-t0)/1000);
  var m = Math.floor(s/60); s = s%60;
  document.getElementById('timer').textContent = '⏱ '+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}, 1000);
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function playPassage(key){ au.src=PASSAGES[key].audio; au.play(); }
function playQAudio(i){ au.src=QUIZ[i].audio; au.play(); }
function isDone(i){ var a=ans[i]; if(a===null||a===undefined) return false; if(QUIZ[i].type==='order') return a.length>0; if(QUIZ[i].type==='fill') return String(a).trim().length>0; return true; }
function render(){
  var q = QUIZ[qi], h = '';
  h += '<div class="sec">'+esc(q.sec)+' · 第 '+(qi+1)+' / '+QUIZ.length+' 题</div>';
  if(q.passage){
    var p = PASSAGES[q.passage];
    h += '<div class="passage"><b>'+esc(p.title)+'</b><br>'+esc(p.text)+'<br><button class="playbtn" onclick="playPassage(\''+q.passage+'\')">🔊 听短文</button></div>';
  }
  if(q.audio){
    h += '<div><button class="playbtn" onclick="playQAudio('+qi+')">🔊 播放听力</button></div>';
  }
  h += '<div class="q">'+esc(q.q)+'</div>';
  if(q.type==='choice'){
    q.options.forEach(function(o,idx){
      var cls = (ans[qi]===idx) ? 'opt sel' : 'opt';
      h += '<button class="'+cls+'" onclick="pick('+idx+')">'+esc(o)+'</button>';
    });
  } else if(q.type==='order'){
    var cur = ans[qi] || [];
    h += '<div id="built">';
    cur.forEach(function(wi,k){ h += '<span class="bchip" onclick="unpick('+k+')">'+esc(q.words[wi])+' ✕</span>'; });
    if(!cur.length) h += '<span style="color:#b7a78f">点下面的单词组句子，点已选的词可撤回</span>';
    h += '</div><div class="hint">💡 点已选的单词可退回重选，点下面的单词继续组句</div><div class="wpool">';
    q.words.forEach(function(w,idx){
      h += '<button class="wchip'+(cur.indexOf(idx)>=0?' used':'')+'" onclick="wpick('+idx+')">'+esc(w)+'</button>';
    });
    h += '</div><div><button class="qbtn ghost" onclick="ans['+qi+']=[];render();drawPal()">清空重组</button></div>';
  } else if(q.type==='fill'){
    var v = (ans[qi]===null||ans[qi]===undefined)?'':ans[qi];
    h += '<div id="filldisp" class="filldisp">'+(v?esc(v):'<span style="color:#b7a78f">点下面的字母拼出单词</span>')+'</div>';
    h += '<div class="kbd">';
    var rows = ["qwertyuiop","asdfghjkl","zxcvbnm"];
    rows.forEach(function(r){
      for(var ci=0;ci<r.length;ci++){
        var ch = r.charAt(ci);
        h += '<button class="key" data-k="'+ch+'" onclick="ktype(this.dataset.k)">'+ch+'</button>';
      }
    });
    h += '<button class="key" data-k="&#39;" onclick="ktype(this.dataset.k)">’</button>';
    h += '<button class="key wide" data-k=" " onclick="ktype(this.dataset.k)">空格</button>';
    h += '<button class="key wide" onclick="kback()">⌫ 删除</button>';
    h += '<button class="key wide" onclick="kclear()">清空</button>';
    h += '</div>';
    h += '<div class="hint">💡 用下面的字母键盘拼出单词的正确形式；大小写无关</div>';
  }
  document.getElementById('card').innerHTML = h;
  document.getElementById('pgnum').textContent = (qi+1)+' / '+QUIZ.length;
  document.getElementById('prev').disabled = (qi===0);
  document.getElementById('next').disabled = (qi===QUIZ.length-1);
  drawPal(); au.pause();
}
function pick(idx){ if(submitted) return; ans[qi]=idx; render(); }
function wpick(wi){ if(submitted) return; var cur=ans[qi]||[]; if(cur.indexOf(wi)<0){cur.push(wi);} ans[qi]=cur; render(); }
function unpick(k){ if(submitted) return; var cur=ans[qi]||[]; cur.splice(k,1); ans[qi]=cur; render(); }
function fillIn(v){ if(submitted) return; ans[qi]=v; drawPal(); }
function fillShow(){
  var v = (ans[qi]===null||ans[qi]===undefined)?'':String(ans[qi]);
  var d = document.getElementById('filldisp');
  if(d){ d.innerHTML = v ? esc(v) : '<span style="color:#b7a78f">点下面的字母拼出单词</span>'; }
  drawPal();
}
function ktype(ch){ if(submitted) return; var v=(ans[qi]===null||ans[qi]===undefined)?'':String(ans[qi]); if(v.length<24){ ans[qi]=v+ch; } fillShow(); }
function kback(){ if(submitted) return; var v=(ans[qi]===null||ans[qi]===undefined)?'':String(ans[qi]); ans[qi]=v.slice(0,-1); fillShow(); }
function kclear(){ if(submitted) return; ans[qi]=''; fillShow(); }
function goQ(d){ var nq=qi+d; if(nq<0||nq>=QUIZ.length) return; qi=nq; render(); }
function jump(i){ qi=i; render(); window.scrollTo(0,0); }
function drawPal(){
  var h='';
  for(var i=0;i<QUIZ.length;i++){
    h += '<button class="pn'+(isDone(i)?' done':'')+(i===qi?' cur':'')+'" onclick="jump('+i+')">'+(i+1)+'</button>';
  }
  document.getElementById('pgrid').innerHTML = h;
}
function norm(s){ return s.toLowerCase().replace(/\s+/g,' ').trim(); }
function qCorrect(i){
  var q=QUIZ[i], a=ans[i];
  if(a===null||a===undefined) return false;
  if(q.type==='choice') return a===q.answer;
  if(q.type==='fill'){
    var vv = norm(String(a));
    if(!vv) return false;
    return q.answers.some(function(x){ return norm(x)===vv; });
  }
  if(!a.length) return false;
  return norm(a.map(function(wi){return q.words[wi];}).join(' '))===norm(q.answer);
}
function confirmSubmit(){
  var left=0; for(var i=0;i<QUIZ.length;i++) if(!isDone(i)) left++;

  if(confirm(msg)) doSubmit();
}
function doSubmit(){
  submitted=true; timerOn=false;
  var score=0; for(var i=0;i<QUIZ.length;i++) if(qCorrect(i)) score++;
  var n=QUIZ.length, pct=Math.round(score/n*100), stars='';
  for(var s=0;s<5;s++) stars += (s < Math.round(pct/20) ? '⭐' : '☆');
  var msg = pct===100?'满分！太了不起了！':(pct>=85?'优秀！继续保持！':(pct>=60?'及格了，再复习一下错题吧！':'没关系，看看错题解析再来一次吧！'));
  var h='<div class="sec">🎯 交卷成功！</div>';
  h+='<div class="stars">'+stars+'</div>';
  h+='<div class="bigscore">'+score+' / '+n+'（'+pct+'分）</div>';
  h+='<div class="q" style="text-align:center;font-size:1rem;color:#8a7a68">'+msg+'</div>';
  h+='<div class="review">';
  QUIZ.forEach(function(q,i){
    var ok=qCorrect(i), mine;
    if(q.type==='choice'){ mine = (ans[i]===null||ans[i]===undefined)?'（未作答）':q.options[ans[i]]; }
    else if(q.type==='fill'){ mine = (ans[i]&&String(ans[i]).trim())?ans[i]:'（未作答）'; }
    else { mine = (ans[i]&&ans[i].length)?ans[i].map(function(wi){return q.words[wi];}).join(' '):'（未作答）'; }
    var right = q.type==='choice'?q.options[q.answer]:(q.type==='fill'?q.answers.join(' / '):q.answer);
    h+='<div class="'+(ok?'rok':'rbad')+'">'+(ok?'✅':'❌')+' 第'+(i+1)+'题：'+esc(q.q).substring(0,26)+'…<br>　你的答案：'+esc(mine)+'<br>　正确答案：'+esc(right)+(ok?'':'<br>　💡 '+esc(q.exp||''))+'</div>';
  });
  h+='</div><div style="text-align:center;margin-top:12px"><button class="qbtn" onclick="location.reload()">🔄 再测一次</button></div>';
  document.getElementById('card').innerHTML=h;
  document.getElementById('nav').style.display='none';
  document.getElementById('palette').style.display='none';
  document.getElementById('timer').textContent+=' ⏹';
  window.scrollTo(0,0);
}
render();
</script>

(function(){

      if (!(window.Shelf && Shelf.reportWrong)) return;

        if (qCorrect(i)) return;
        var mine, right;
        if (q.type === 'choice'){ mine = (ans[i]===null||ans[i]===undefined)?'（未作答）':q.options[ans[i]]; right = q.options[q.answer]; }
        else if (q.type === 'fill'){ mine = (ans[i]&&String(ans[i]).trim())?ans[i]:'（未作答）'; right = q.answers.join(' / '); }
        else { mine = (ans[i]&&ans[i].length)?ans[i].map(function(wi){return q.words[wi];}).join(' '):'（未作答）'; right = q.answer; }
