<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Georgia,'Times New Roman',serif;background:linear-gradient(135deg,#fff7e6,#e6f7ff);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px;color:#4a3728}
h1{font-size:1.3rem;margin:8px 0 4px;color:#c2703d;text-align:center}
.sub{color:#8a7a68;margin-bottom:10px;font-size:.9rem;text-align:center}
#timer{font-size:.95rem;color:#c2703d;font-weight:bold;margin-bottom:8px}
#card{background:#fff;border-radius:24px;box-shadow:0 8px 30px rgba(0,0,0,.12);max-width:640px;width:100%;padding:26px;min-height:440px;display:flex;flex-direction:column}
#card .sec{font-size:.95rem;color:#c2703d;font-weight:bold;margin-bottom:10px}
#card .q{font-size:1.2rem;line-height:1.7;margin-bottom:14px}
.passage{background:#fffdf4;border:1px dashed #e0b96a;border-radius:12px;padding:12px;font-size:.98rem;line-height:1.8;margin-bottom:12px;color:#6b5a44}
.opt{display:block;width:100%;margin:8px 0;padding:12px;border:2px solid #ffd9a0;border-radius:14px;background:#fffdf8;font-size:1.05rem;cursor:pointer;color:#4a3728;text-align:left}
.opt.sel{background:#dbeeff;border-color:#4a90d9}
.wpool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.wchip{background:#fffdf8;border:2px solid #ffd9a0;border-radius:999px;padding:8px 14px;font-size:1rem;cursor:pointer;color:#4a3728}
.wchip.used{opacity:.25;pointer-events:none}
#built{min-height:52px;border:2px dashed #e0b96a;border-radius:12px;padding:10px;font-size:1.1rem;margin-bottom:10px;color:#4a3728}
.bchip{display:inline-block;background:#dbeeff;border-radius:999px;padding:6px 12px;margin:3px;font-size:1rem;cursor:pointer}
.filldisp{min-height:56px;border:2px solid #ffd9a0;border-radius:14px;padding:12px;font-size:1.35rem;margin-bottom:12px;background:#fffdf8;color:#4a3728;letter-spacing:2px;font-family:inherit}
.kbd{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:8px}
.key{min-width:38px;max-width:50px;flex:1 0 auto;padding:10px 0;background:#fff;border:2px solid #ffd9a0;border-radius:10px;font-size:1.15rem;color:#4a3728;cursor:pointer;font-family:inherit}
.key:active{background:#dbeeff;border-color:#4a90d9}
.key.wide{max-width:120px;flex:2 0 auto;font-size:1rem}
.qbtn{font-size:1rem;background:#ffb84d;border:none;border-radius:999px;padding:11px 26px;cursor:pointer;color:#5a3a1a;font-weight:bold;box-shadow:0 4px 12px rgba(255,184,77,.5)}
.qbtn.ghost{background:#fff;border:2px solid #ffb84d;color:#c2703d;box-shadow:none}
.qbtn.danger{background:#e06666;color:#fff;box-shadow:0 4px 12px rgba(224,102,102,.4)}
.playbtn{font-size:.95rem;background:#ffb84d;border:none;border-radius:999px;padding:8px 20px;cursor:pointer;color:#5a3a1a;font-weight:bold;margin-bottom:10px}
#nav{display:flex;gap:12px;align-items:center;margin-top:14px;flex-wrap:wrap;justify-content:center}
#nav button{font-size:.95rem;background:#fff;border:2px solid #ffb84d;border-radius:999px;padding:10px 20px;cursor:pointer;color:#c2703d;font-weight:bold}
#nav button:disabled{opacity:.35;cursor:default}
#pgnum{font-size:.95rem;color:#8a7a68;min-width:80px;text-align:center}
#palette{max-width:640px;width:100%;background:#fff;border-radius:18px;box-shadow:0 4px 16px rgba(0,0,0,.08);padding:14px;margin-top:14px}
#palette .pt{font-size:.9rem;color:#8a7a68;margin-bottom:8px}
#pgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.pn{aspect-ratio:1;border:2px solid #ffd9a0;background:#fffdf8;border-radius:10px;font-size:.9rem;color:#8a7a68;cursor:pointer}
.pn.done{background:#dbeeff;border-color:#4a90d9;color:#2a5a9a;font-weight:bold}
.pn.cur{border-color:#c2703d;box-shadow:0 0 0 2px #ffd9a0}
.stars{font-size:2.4rem;margin:10px 0;letter-spacing:6px;text-align:center}
.bigscore{font-size:2rem;color:#c2703d;font-weight:bold;text-align:center;margin:6px 0}
.review{text-align:left;font-size:.92rem;line-height:1.9;margin-top:8px}
.review .rok{color:#2e7d32}
.review .rbad{color:#c62828}
.hint{font-size:.85rem;color:#8a7a68;margin-top:8px;text-align:center}

s 开头。"}, {"sec": "二、单项选择", "type": "choice", "q": "What ______ he like doing?", "options": ["does", "do", "is"], "answer": 0, "exp": "he 是第三人称单数，特殊疑问句用 does。"}, {"sec": "二、单项选择", "type": "choice", "q": "______ your mother like dancing?", "options": ["Does", "Do", "Is"], "answer": 0, "exp": "your mother 是第三人称单数，用 Does。"}, {"sec": "二、单项选择", "type": "choice", "q": "He ______ playing football.", "options": ["like", "likes", "liking"], "answer": 1, "exp": "he 是第三人称单数，like 加 s 变成 likes。"}, {"sec": "二、单项选择", "type": "choice", "q": "They ______ like swimming.", "options": ["doesn't", "don't", "isn't"], "answer": 1, "exp": "they 是复数，否定用 don't；doesn't 是给第三人称单数（he/she）用的。"}, {"sec": "二、单项选择", "type": "choice", "q": "Does he like ______? Yes, he does.", "options": ["swim", "swimming", "swims"], "answer": 1, "exp": "like 后面的动词要加 ing：like swimming。"}, {"sec": "二、单项选择", "type": "choice", "q": "What does Tina like ______?", "options": ["do", "doing", "does"], "answer": 1, "exp": "like doing 是固定搭配，like 后面动词加 ing。"}, {"sec": "二、单项选择", "type": "choice", "q": "She doesn't ______ singing.", "options": ["like", "likes", "liking"], "answer": 0, "exp": "doesn't 后面跟动词原形，like 不能加 s。"}, {"sec": "二、单项选择", "type": "choice", "q": "______ Liu Tao like playing ping-pong?", "options": ["Does", "Do", "Is"], "answer": 0, "exp": "Liu Tao 是一个男生，第三人称单数，疑问句用 Does。"}, {"sec": "二、单项选择", "type": "choice", "q": "I ______ good at paper-cutting, but I like trying new things.", "options": ["am not", "is not", "are not"], "answer": 0, "exp": "I 后面用 am，否定就是 am not。"}, {"sec": "二、单项选择", "type": "choice", "q": "Dancing ______ her healthy.", "options": ["keep", "keeps", "keeping"], "answer": 1, "exp": "Dancing 是动名词作主语，看作单数，keep 加 s 变成 keeps。"}, {"sec": "二、单项选择", "type": "choice", "q": "______ your hobby?", "options": ["What's", "What're", "What"], "answer": 0, "exp": "问\"是什么\"用 What's（= What is）。"}, {"sec": "三、连词成句", "type": "order", "q": "把下面的词连成一句话。", "words": ["doing", "she", "?", "what", "like", "does"], "answer": "what does she like doing ?", "exp": "特殊疑问句语序：疑问词 what + does + 主语 she + like doing。"}, {"sec": "三、连词成句", "type": "order", "q": "把下面的词连成一句话。", "words": ["singing", "she", "likes", "."], "answer": "she likes singing .", "exp": "陈述句语序：主语 she + likes（三单加 s）+ singing。"}, {"sec": "三、连词成句", "type": "order", "q": "把下面的词连成一句话。", "words": ["happy", "makes", "her", "it", "."], "answer": "it makes her happy .", "exp": "It makes her happy：它让她开心，注意 makes 加 s。"}, {"sec": "三、连词成句", "type": "order", "q": "把下面的词连成一句话。", "words": ["Club", "join", "Dance", "wants", "he", "the", "to", "."], "answer": "he wants to join the dance club .", "exp": "want to do 想要做某事：He wants to join the Dance Club."}, {"sec": "三、连词成句", "type": "order", "q": "把下面的词连成一句话。", "words": ["doing", "do", "?", "what", "like", "you"], "answer": "what do you like doing ?", "exp": "you 是第二人称，疑问句用 do：What do you like doing?"}, {"sec": "四、用所给单词的适当形式填空", "type": "fill", "q": "She likes ______ (dance).", "answers": ["dancing"], "exp": "like 后面的动词要加 ing，dance 变成 dancing。"}, {"sec": "四、用所给单词的适当形式填空", "type": "fill", "q": "It ______ (make) her happy.", "answers": ["makes"], "exp": "It 是第三人称单数，make 加 s 变成 makes。"}, {"sec": "四、用所给单词的适当形式填空", "type": "fill", "q": "He ______ (like) playing ping-pong.", "answers": ["likes"], "exp": "He 是第三人称单数，like 加 s 变成 likes。"}, {"sec": "四、用所给单词的适当形式填空", "type": "fill", "q": "They ______ (not like) swimming.", "answers": ["don't like", "do not like"], "exp": "they 是复数，否定用 don't + 动词原形：don't like。"}, {"sec": "四、用所给单词的适当形式填空", "type": "fill", "q": "Yang Ling ______ (learn) a lot from reading.", "answers": ["learns"], "exp": "Yang Ling 是第三人称单数，learn 加 s 变成 learns。"}, {"sec": "四、用所给单词的适当形式填空", "type": "fill", "q": "What ______ (do) she like doing?", "answers": ["does"], "exp": "she 是第三人称单数，疑问句中 do 变成 does。"}, {"sec": "五、阅读理解", "type": "choice", "q": "When is Tina's birthday?", "options": ["Today", "Tomorrow", "Next week"], "answer": 1, "passage": "A", "exp": "短文第一句：Tina's birthday is tomorrow.（Tina 的生日是明天。）"}, {"sec": "五、阅读理解", "type": "choice", "q": "Who wants to buy a gift for Tina?", "options": ["Bobby", "Her brother", "Sam"], "answer": 0, "passage": "A", "exp": "短文：Bobby wants to buy a gift for her.（Bobby 想给她买礼物。）"}, {"sec": "五、阅读理解", "type": "choice", "q": "Does Tina like drawing?", "options": ["Yes, she does.", "No, she doesn't.", "We don't know."], "answer": 1, "passage": "A", "exp": "她哥哥说：No, she doesn't like drawing.（不，她不喜欢画画。）"}, {"sec": "五、阅读理解", "type": "choice", "q": "What does Tina like doing?", "options": ["Singing", "Dancing", "Skipping"], "answer": 0, "passage": "A", "exp": "短文最后：She likes singing.（她喜欢唱歌。）"}, {"sec": "五、阅读理解", "type": "choice", "q": "Singing ______ Tina happy.", "options": ["make", "makes", "making"], "answer": 1, "passage": "A", "exp": "Singing 动名词作主语看作单数，make 加 s 变成 makes。"}, {"sec": "五、阅读理解", "type": "choice", "q": "What does Mike like doing?", "options": ["Dancing", "Singing", "Reading"], "answer": 0, "passage": "B", "exp": "短文：Mike likes dancing.（Mike 喜欢跳舞。）"}, {"sec": "五、阅读理解", "type": "choice", "q": "Why does Mike like dancing?", "options": ["It makes him happy.", "It keeps him healthy.", "He can make new friends."], "answer": 1, "passage": "B", "exp": "短文：It keeps him healthy.（跳舞让他保持健康。）"}, {"sec": "五、阅读理解", "type": "choice", "q": "What club does Su Hai want to join?", "options": ["Dance Club", "Paper-cutting Club", "Reading Club"], "answer": 1, "passage": "B", "exp": "短文：She wants to join the Paper-cutting Club."}, {"sec": "五、阅读理解", "type": "choice", "q": "Who likes playing ping-pong?", "options": ["Mike", "Liu Tao", "Wang Bing"], "answer": 1, "passage": "B", "exp": "短文：Liu Tao likes playing ping-pong."}, {"sec": "五、阅读理解", "type": "choice", "q": "Yang Ling learns ______ from reading.", "options": ["nothing", "a little", "a lot"], "answer": 2, "passage": "B", "exp": "短文：She learns a lot from reading.（她从阅读中学到了很多。）"}];

    else { mine = (ans[i]&&ans[i].length)?ans[i].map(function(wi){return q.words[wi];}).join(' '):'（未作答）'; }
    var right = q.type==='choice'?q.options[q.answer]:(q.type==='fill'?q.answers.join(' / '):q.answer);
    h+='<div class="'+(ok?'rok':'rbad')+'">'+(ok?'✅':'❌')+' 第'+(i+1)+'题：'+esc(q.q).substring(0,26)+'…<br>　你的答案：'+esc(mine)+'<br>　正确答案：'+esc(right)+(ok?'':'<br>　💡 '+esc(q.exp||''))+'</div>';
  });
  h+='</div><div style="text-align:center;margin-top:12px"><button class="qbtn" onclick="location.reload()">🔄 再测一次</button></div>';
  document.getElementById('card').innerHTML=h;
  document.getElementById('nav').style.display='none';
  document.getElementById('palette').style.display='none';
  document.getElementById('timer').textContent+=' ⏹';
  window.scrollTo(0,0);
}
render();
</script>
</body>
</html>
