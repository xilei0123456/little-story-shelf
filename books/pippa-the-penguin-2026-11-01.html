var qi = 0, qscore = 0, stage = 'story';
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function render(){
  stage='story';
  var p = PAGES[i], h = '';
  h += '<img src="'+p.img+'" alt="illustration">';
  h += '<div class="en">'+esc(p.en)+'</div>';
  h += '<div class="zh">'+esc(p.zh)+'</div>';
  h += '<div><button class="playbtn" data-pk="page' + i + '" data-def="🔊 听这一页" data-on="⏸️ 暂停" data-off="▶️ 继续" onclick="playCur()">🔊 听这一页</button></div>';
  document.getElementById('card').innerHTML = h;
  document.getElementById('pgnum').textContent = (i+1)+' / '+(PAGES.length+1);
  document.getElementById('prev').disabled = (i===0);
  document.getElementById('next').textContent = (i===PAGES.length-1) ? '生词本 →' : '下一页 →';
  document.getElementById('words').style.display = 'none';
  au.pause(); curKey = null;
}
var RATE = 0.85, curKey = null;
function setBtns(){
  document.querySelectorAll('[data-pk]').forEach(function(b){
    var k = b.getAttribute('data-pk');
    if(k === curKey && !au.paused && !au.ended) b.textContent = b.getAttribute('data-on');
    else if(k === curKey && au.currentTime > 0 && !au.ended) b.textContent = b.getAttribute('data-off');
    else b.textContent = b.getAttribute('data-def');
  });
}
function togglePlay(key, src){
  if(curKey === key && au.src){
    if(au.paused) au.play(); else au.pause();
    setBtns(); return;
  }
  curKey = key; au.src = src;
  try{ au.preservesPitch = true; }catch(e){}
  au.playbackRate = RATE;
  au.play(); setBtns();
}
au.addEventListener('ended', setBtns);
au.addEventListener('play', setBtns);
au.addEventListener('pause', setBtns);
function playCur(){ togglePlay('page' + i, PAGES[i].audio); }
function playWord(idx){ togglePlay('word' + idx, WORDS[idx].audio); }
function go(d){
  if(stage!=='story') return;
  if(i===PAGES.length-1 && d===1){
    if(QUIZ.length){ stage='quiz'; qi=0; qscore=0; showQuiz(); }
    else { stage='words'; showWords(); }
    return;
  }
  if(i===0 && d===-1) return;
  i += d; render();
}
function qAudio(idx){ togglePlay('quiz' + idx, QUIZ[idx].audio); }
function showQuiz(){
  stage='quiz'; au.pause();
  var q = QUIZ[qi], h = '';
  h += '<div style="font-size:1rem;color:#c2703d;font-weight:bold;margin-bottom:10px">📝 小测验 Quiz '+(qi+1)+' / '+QUIZ.length+'</div>';
  h += '<div class="q">'+esc(q.q)+'</div>';
  h += '<div class="qzh">'+esc(q.zh)+'</div>';
  h += '<div><button class="playbtn" style="margin-bottom:10px" data-pk="quiz'+qi+'" data-def="🔊 听题目" data-on="⏸️ 暂停" data-off="▶️ 继续" onclick="qAudio('+qi+')">🔊 听题目</button></div>';
  q.options.forEach(function(o,idx){
    h += '<button class="opt" id="opt'+idx+'" onclick="answerQuiz('+idx+')">'+esc(o)+'</button>';
  });
  h += '<div class="qfb" id="qfb"></div><div id="qnext"></div>';
  document.getElementById('card').innerHTML = h;
  document.getElementById('pgnum').textContent = '测验 '+(qi+1)+' / '+QUIZ.length;
  document.getElementById('prev').disabled = false;
  document.getElementById('next').disabled = true;
  document.getElementById('words').style.display = 'none';
}
function answerQuiz(sel){
  var q = QUIZ[qi], ok = (sel===q.answer);
  q.options.forEach(function(o,idx){
    var b = document.getElementById('opt'+idx);
    b.disabled = true;
    if(idx===q.answer) b.classList.add('correct');
    else if(idx===sel) b.classList.add('wrong');
  });
  if(ok){ qscore++; document.getElementById('qfb').textContent = '✅ 太棒了！'; }
  else { document.getElementById('qfb').textContent = '🤔 再想想，正确答案是：'+q.options[q.answer]; }
  var last = (qi===QUIZ.length-1);
  document.getElementById('qnext').innerHTML = '<button class="qbtn" onclick="nextQuiz()">'+(last?'看我的得分 →':'下一题 →')+'</button>';
}
function nextQuiz(){
  qi++;
  if(qi<QUIZ.length) showQuiz(); else showScore();
}
function showScore(){
  stage='score'; au.pause();
  var n = QUIZ.length, stars = '';
  for(var s=0;s<n;s++) stars += (s<qscore?'⭐':'☆');
  var msg = qscore===n ? '全对！你真是阅读小高手！' : (qscore>=Math.ceil(n/2) ? '很棒！再读一遍故事会更棒哦！' : '没关系，回去再读读故事吧！');
  var h = '<div style="font-size:1.2rem;color:#c2703d;font-weight:bold;margin-bottom:8px">🎯 测验完成！</div>';
  h += '<div class="stars">'+stars+'</div>';
  h += '<div class="en">'+qscore+' / '+n+'</div>';
  h += '<div class="zh">'+msg+'</div>';
  h += '<div><button class="qbtn" onclick="goWords()">生词本 →</button></div>';
  document.getElementById('card').innerHTML = h;
  document.getElementById('pgnum').textContent = '得分';
  document.getElementById('prev').disabled = false;
  document.getElementById('next').disabled = true;
  document.getElementById('words').style.display = 'none';
}
function goWords(){ stage="words"; showWords(); }
function showWords(){
  stage='words';
  document.getElementById('card').innerHTML = '<div class="en" style="font-size:1.8rem;color:#c2703d;font-weight:bold">The End 💛</div><div class="zh">'+esc(ENDZH)+'</div>';
  var t = '<tr><th></th><th>Word</th><th></th><th>中文</th></tr>';
  WORDS.forEach(function(w,idx){ t += '<tr><td><button class="wbtn" data-pk="word'+idx+'" data-def="🔊" data-on="⏸️" data-off="▶️" onclick="playWord('+idx+')">🔊</button></td><td class="word">'+esc(w.word)+'</td><td>'+esc(w.pos)+'</td><td>'+esc(w.zh)+'</td></tr>'; });
  document.getElementById('wtable').innerHTML = t;
  document.getElementById('words').style.display = 'block';
  document.getElementById('pgnum').textContent = (PAGES.length+1)+' / '+(PAGES.length+1);
  document.getElementById('next').disabled = true;
  document.getElementById('prev').disabled = false;
  au.pause();
}
document.getElementById('prev').addEventListener('click', function(){
  if(stage==='words'){
    document.getElementById('next').disabled=false;
    if(QUIZ.length){ showScore(); } else { i=PAGES.length-1; stage='story'; render(); }
  } else if(stage==='score'){
    qi=QUIZ.length-1; showQuiz();
  } else if(stage==='quiz'){
    if(qi===0){ i=PAGES.length-1; stage='story'; render(); }
    else { qi--; showQuiz(); }
  }
});
render();
</script>
<!-- __FOLLOWREAD_V6__ -->
<div id="frBar" style="display:none;margin:14px auto 6px;max-width:92%;background:#fff8ec;border:1.5px solid #f0c929;border-radius:16px;padding:12px 14px;text-align:center;font-family:inherit;">
  <div id="frScoreMode">
    <button id="frBtn" style="font-size:18px;padding:12px 26px;border:none;border-radius:999px;background:#f08c2e;color:#fff;font-weight:700;touch-action:none;-webkit-touch-callout:none;user-select:none;">🎤 按住跟读，松手出分</button>
    <div style="font-size:12.5px;color:#b39b7d;margin-top:4px;">按住按钮把这页读出来，读完松手</div>
    <div id="frBest" style="font-size:13px;color:#b39b7d;margin-top:6px;"></div>
    <div id="frOut" style="font-size:17px;line-height:1.7;margin-top:6px;"></div>
  </div>
  <div id="frRecMode" style="display:none;">
    <div style="font-size:14px;color:#8a6d3b;">这台手机的自动评分用不了，咱们用录音模式，一样能练 🎧</div>
    <div style="margin-top:8px;">
      <button id="frRecBtn" style="font-size:18px;padding:12px 26px;border:none;border-radius:999px;background:#f08c2e;color:#fff;font-weight:700;touch-action:none;-webkit-touch-callout:none;user-select:none;">🎙 按住录音，松手停</button>
    </div>
    <div style="margin-top:12px;">
      <button id="frPlayBtn" onclick="frPlay()" style="display:none;font-size:18px;padding:10px 22px;border:none;border-radius:999px;background:#2f9e44;color:#fff;font-weight:700;">▶️ 听回放</button>
    </div>
    <div style="margin-top:10px;">
      <button id="frScoreBtn" onclick="frScore()" style="display:none;font-size:18px;padding:10px 22px;border:none;border-radius:999px;background:#9775fa;color:#fff;font-weight:700;">📤 交给红豆评分</button>
    </div>
    <div id="frRecOut" style="font-size:15px;color:#8a6d3b;margin-top:6px;"></div>
    <div style="margin-top:6px;"><a href="javascript:void(0)" onclick="frTryScore()" style="font-size:13px;color:#b39b7d;">再试试自动评分</a></div>
  </div>
</div>
<script>
(function(){
  function $(id){ return document.getElementById(id); }
  var frWatch = null, frPending = '';
  var EXPAND = {"don't":"do not","doesn't":"does not","can't":"can not","won't":"will not","it's":"it is","i'm":"i am","you're":"you are","we're":"we are","he's":"he is","she's":"she is","that's":"that is","let's":"let us","isn't":"is not","aren't":"are not","didn't":"did not","what's":"what is","there's":"there is","isnt":"is not","dont":"do not","cant":"can not"};
  function frTokens(s){
    s = (s || '').toLowerCase().replace(/[‘’]/g, "'").replace(/[^a-z0-9' ]/g, ' ').replace(/\s+/g, ' ').trim();
    if (!s) return [];
    var out = [];
    s.split(' ').forEach(function(w){
      if (EXPAND[w]) EXPAND[w].split(' ').forEach(function(x){ out.push(x); });
      else out.push(w.replace(/'/g, ''));
    });
    return out.filter(function(w){ return w.length; });
  }
  function frTarget(){
    try { if (window.PAGES && window.PAGES[window.i]) return window.PAGES[window.i].en || ''; } catch(e){}
    return '';
  }
  function frBestKey(){ return 'frbest_v1_' + location.pathname + '_' + (window.i || 0); }
  function frShowBest(){
    var el = $('frBest'); if (!el) return;
    var b = 0;
    try { b = parseInt(localStorage.getItem(frBestKey()) || '0', 10) || 0; } catch(e){}
    el.textContent = b > 0 ? ('本页最佳 ' + '⭐'.repeat(b)) : '';
  }
  var frLastPage = -1;
  setInterval(function(){
    var bar = $('frBar'); if (!bar) return;
    var show = false;
    try { show = (window.stage === 'story'); } catch(e){}
    bar.style.display = show ? '' : 'none';
    if (show) frShowBest();
    try {
      if (window.i !== frLastPage){
        if (frLastPage !== -1 && !frHolding && !frRecHolding){
          $('frOut').innerHTML = '';
          $('frPlayBtn').style.display = 'none';
          $('frScoreBtn').style.display = 'none';
          $('frRecOut').textContent = '';
        }
        frLastPage = window.i;
      }
    } catch(e){}
  }, 600);
  function frToRecMode(){
    $('frScoreMode').style.display = 'none';
    $('frRecMode').style.display = '';
  }
  function frToScoreMode(){
    $('frRecMode').style.display = 'none';
    $('frScoreMode').style.display = '';
  }
  var canRec = false;
  try { canRec = !!window.Shelf && !!Shelf.recAvailable && !!Shelf.recAvailable(); } catch(e){}
  var prefRec = false;
  try { prefRec = localStorage.getItem('fr_mode') === 'rec'; } catch(e){}
  if (window.Shelf && (!canRec || prefRec)) frToRecMode();

  function frClearWatch(){ if (frWatch){ clearTimeout(frWatch); frWatch = null; } }
  var frHolding = false, frHoldT = 0;
  function frResetBtn(){
    frClearWatch();
    frHolding = false;
    var b = $('frBtn');
    b.disabled = false; b.textContent = '🎤 按住跟读，松手出分'; b.style.background = '#f08c2e';
  }
  function frFallback(){
    frResetBtn();
    try { localStorage.setItem('fr_mode', 'rec'); } catch(e){}
    frToRecMode();
    $('frRecOut').textContent = '自动评分喊不动，已经换成录音模式啦，按住按钮读给我听 🎧';
  }
  window.frTryScore = function(){
    try { localStorage.removeItem('fr_mode'); } catch(e){}
    frToScoreMode();
    $('frOut').innerHTML = '<span style="color:#8a6d3b;">好，再点一次「🎤 跟读这一页」试试</span>';
  };
  window.frStart = function(){
    if (frHolding) return;
    if (!window.Shelf || !Shelf.startFollowRead) return;
    frHolding = true; frHoldT = Date.now();
    frPending = 'score';
    var b = $('frBtn');
    b.textContent = '🔴 正在听…松手出分'; b.style.background = '#e8590c';
    $('frOut').innerHTML = '';
    try { Shelf.startFollowRead(); } catch(e){ frResetBtn(); return; }
    frClearWatch();
    frWatch = setTimeout(frFallback, 30000);
  };
  window.frStop = function(){
    if (!frHolding) return;
    frHolding = false;
    var b = $('frBtn');
    b.textContent = '🎤 按住跟读，松手出分'; b.style.background = '#f08c2e';
    if (Date.now() - frHoldT < 500){
      try { Shelf.stopFollowRead(); } catch(e){}
      frClearWatch();
      $('frOut').innerHTML = '<span style="color:#8a6d3b;">按住不放，把这页读完再松手哦 🙂</span>';
      return;
    }
    try { Shelf.stopFollowRead(); } catch(e){}
    $('frOut').innerHTML = '<span style="color:#8a6d3b;">正在算分，等一下…</span>';
    frClearWatch();
    frWatch = setTimeout(frFallback, 4000);
  };
  window.onFollowListening = function(){};
  window.onMicPerm = function(granted){
    if (granted){
      if (frPending === 'rec') frRecStart(); else frStart();
    } else {
      frResetBtn();
      $('frOut').innerHTML = '<span style="color:#e8590c;">要用麦克风才能跟读哦，去设置里允许一下 🙏</span>';
      var ro = $('frRecOut'); if (ro) ro.textContent = '要用麦克风才能录音哦，去设置里允许一下 🙏';
    }
  };
  window.onFollowError = function(code){
    if (code === 'unavailable'){ frFallback(); return; }
    frResetBtn();
    if (code === 'perm'){
      $('frOut').innerHTML = '<span style="color:#e8590c;">点允许麦克风，就能开始跟读啦 🎤</span>';
      return;
    }
    if (code === 'rec6' || code === 'rec7' || code === 'rec2'){
      $('frOut').innerHTML = '<span style="color:#e8590c;">没听清，再大声读一次试试 🙂</span>';
      return;
    }
    $('frOut').innerHTML = '<span style="color:#e8590c;">这次没成功，再点一次试试 🙂</span>';
  };
  window.onFollowResult = function(text){
    frResetBtn();
    var target = frTarget();
    var tt = frTokens(target), st = frTokens(text);
    var n = tt.length, m = st.length;
    if (!n){ $('frOut').innerHTML = ''; return; }
    var dp = [], a, b;
    for (a = 0; a <= n; a++){ dp.push([0]); }
    for (b = 1; b <= m; b++) dp[0].push(0);
    for (a = 1; a <= n; a++) for (b = 1; b <= m; b++)
      dp[a][b] = tt[a-1] === st[b-1] ? dp[a-1][b-1] + 1 : Math.max(dp[a-1][b], dp[a][b-1]);
    var matched = {}, x = n, y = m;
    while (x > 0 && y > 0){
      if (tt[x-1] === st[y-1]){ matched[x-1] = 1; x--; y--; }
      else if (dp[x-1][y] >= dp[x][y-1]) x--; else y--;
    }
    var correct = dp[n][m];
    var dispWords = target.replace(/[‘’]/g, "'").split(/\s+/).filter(function(w){ return w.length; });
    var html = tt.map(function(w, idx){
      var disp = dispWords[Math.min(idx, dispWords.length - 1)] || w;
      return matched[idx]
        ? '<span style="color:#2f9e44;font-weight:700;">' + disp + '</span>'
        : '<span style="color:#e8590c;text-decoration:underline;">' + disp + '</span>';
    }).join(' ');
    var pct = n ? correct / n : 0, stars = pct >= 0.9 ? 3 : pct >= 0.7 ? 2 : pct >= 0.45 ? 1 : 0;
    var msg = stars === 3 ? '太棒了，读得真准！' : stars === 2 ? '读得很好！' : stars === 1 ? '不错，继续加油！' : '再试一次，你可以的！';
    try {
      var prev = parseInt(localStorage.getItem(frBestKey()) || '0', 10) || 0;
      if (stars > prev) localStorage.setItem(frBestKey(), String(stars));
    } catch(e){}
    $('frOut').innerHTML =
      '<div style="font-size:22px;">' + (stars ? '⭐'.repeat(stars) : '💪') + ' <b>' + msg + '</b></div>' +
      '<div style="margin-top:4px;">' + html + '</div>' +
      '<div style="font-size:13px;color:#b39b7d;margin-top:4px;">读对了 ' + correct + ' / ' + n + ' 个词 · 手机听到的是：' + (text || '') + '</div>';
    frShowBest();
  };

  var frRecHolding = false;
  window.frRecStart = function(){
    if (frRecHolding) return;
    if (!window.Shelf || !Shelf.startRecOnly) return;
    frRecHolding = true;
    $('frPlayBtn').style.display = 'none';
    $('frScoreBtn').style.display = 'none';
    $('frRecOut').textContent = '';
    frPending = 'rec';
    try { Shelf.startRecOnly(); } catch(e){ frRecHolding = false; }
  };
  window.frRecStop = function(){
    if (!frRecHolding) return;
    frRecHolding = false;
    try { Shelf.stopRecOnly(); } catch(e){}
  };
  window.frPlay = function(){ try { Shelf.playRec(); } catch(e){} };
  window.onRecStarted = function(){
    var b = $('frRecBtn');
    b.textContent = '🔴 录音中…松手停'; b.style.background = '#e8590c';
    $('frPlayBtn').style.display = 'none'; $('frRecOut').textContent = '读完松手，就能听回放啦';
  };
  window.onRecStopped = function(){
    var b = $('frRecBtn');
    b.textContent = '🎙 按住录音，松手停'; b.style.background = '#f08c2e';
    $('frPlayBtn').style.display = '';
    if (window.Shelf && Shelf.uploadRecForScore) $('frScoreBtn').style.display = '';
    $('frRecOut').textContent = '录好啦，点「听回放」听听自己读得怎么样 🎧';
  };
  window.onRecPlayEnd = function(){};
  function frBookBase(){
    try { return location.pathname.split('/').pop().replace(/\.html$/, ''); } catch(e){ return 'book'; }
  }
  function frPendingKey(){ return 'frcloud_' + frBookBase() + '_' + window.i; }
  window.frScore = function(){
    if (!window.Shelf || !Shelf.uploadRecForScore) return;
    var b = $('frScoreBtn');
    b.disabled = true; b.textContent = '📤 正在交上去…';
    try { Shelf.uploadRecForScore(frBookBase(), window.i, frTarget()); }
    catch(e){ window.onScoreUploadFailed(); }
  };
  window.onScoreUploaded = function(reqName){
    try { localStorage.setItem(frPendingKey(), reqName + '|' + Date.now()); } catch(e){}
    var b = $('frScoreBtn');
    b.style.display = 'none'; b.disabled = false; b.textContent = '📤 交给红豆评分';
    $('frRecOut').textContent = '交上去啦 📬 红豆批完，分数会自动回到这一页（大概几分钟）';
    frPollCloud();
  };
  window.onScoreUploadFailed = function(){
    var b = $('frScoreBtn');
    b.disabled = false; b.textContent = '📤 交给红豆评分';
    $('frRecOut').textContent = '没交上去，检查一下网络再点一次 📤';
  };
  var frPollBusy = false;
  function frPollCloud(){
    if (frPollBusy) return;
    var raw = null;
    try { raw = localStorage.getItem(frPendingKey()); } catch(e){}
    if (!raw) return;
    var parts = raw.split('|');
    var reqName = parts[0];
    var sentAt = parseInt(parts[1] || '0', 10);
    if (sentAt && Date.now() - sentAt > 2 * 3600 * 1000){
      try { localStorage.removeItem(frPendingKey()); } catch(e){}
      return;
    }
    frPollBusy = true;
    fetch('https://raw.githubusercontent.com/xilei0123456/little-story-shelf/main/data/followread-results/' + reqName + '?t=' + Date.now())
      .then(function(r){ if (!r.ok) throw new Error('nf'); return r.json(); })
      .then(function(res){
        frPollBusy = false;
        try { localStorage.removeItem(frPendingKey()); } catch(e){}
        if (res && typeof res.heard === 'string'){
          frShowScore(res.heard);
          var note = document.createElement('div');
          note.style.cssText = 'font-size:13px;color:#9775fa;margin-top:4px;';
          note.textContent = '☁️ 这是红豆刚批好的分数';
          $('frOut').appendChild(note);
        }
      })
      .catch(function(){ frPollBusy = false; });
  }
  var frTick = 0;
  setInterval(function(){
    frTick++;
    if (frTick % 25 === 0) frPollCloud();
  }, 600);
  setTimeout(frPollCloud, 1500);

  function frBindHold(el, down, up){
    if (!el) return;
    el.addEventListener('touchstart', function(e){ e.preventDefault(); down(); }, {passive:false});
    el.addEventListener('touchend', function(e){ e.preventDefault(); up(); }, {passive:false});
    el.addEventListener('touchcancel', function(){ up(); });
    el.addEventListener('mousedown', function(){ down(); });
    el.addEventListener('mouseup', function(){ up(); });
    el.addEventListener('mouseleave', function(){ if (frHolding || frRecHolding) up(); });
    el.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  }
  frBindHold($('frBtn'), window.frStart, window.frStop);
  frBindHold($('frRecBtn'), window.frRecStart, window.frRecStop);
})();
</script>
